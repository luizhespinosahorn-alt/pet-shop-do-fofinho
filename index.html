<style>

*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:95px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65}
img{display:block;max-width:100%;width:100%;object-fit:cover}
a{color:inherit}.wrap{width:min(1160px,calc(100% - 44px));margin:auto}
.topline{background:var(--deep);color:#f8f4e9;text-align:center;padding:8px 15px;font-size:.78rem;letter-spacing:.04em}
header{position:sticky;top:0;z-index:20;background:rgba(247,244,236,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.nav{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:24px}

.navlinks{display:flex;align-items:center;gap:27px}
.navlinks a{text-decoration:none;color:#555b4e;font-size:.9rem;font-weight:600}
.navlinks a:hover,.navlinks a.active{color:var(--clay)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 21px;border-radius:7px;background:var(--olive);color:white;text-decoration:none;font-weight:700;font-size:.9rem;border:1px solid var(--olive);transition:.2s}

.menu{display:none;border:0;background:none;font-size:1.7rem;color:var(--deep)}
main{min-height:65vh}
.hero{padding:66px 0 76px}
.hero-grid{display:grid;grid-template-columns:1fr 1.03fr;align-items:center;gap:65px}
.kicker{color:var(--clay);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.16em}

h1{font-size:clamp(2.8rem,5.3vw,4.8rem);margin:17px 0 20px;letter-spacing:-.035em}
h2{font-size:clamp(2.1rem,4vw,3.25rem);margin:12px 0 17px;letter-spacing:-.025em}
h3{font-size:1.45rem;margin:0 0 10px}
p{color:var(--muted);margin:0 0 17px}
.hero-copy>p{font-size:1.07rem;max-width:470px;line-height:1.85}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero-image{height:510px;position:relative}

.image-note b{font-family:var(--serif);font-size:1.1rem;display:block}

.trust{margin-top:28px;font-size:.86rem;color:var(--muted)}.stars{color:#b8874c;letter-spacing:2px}
.intro{background:var(--sage);padding:23px 0}
.intro-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.intro-item{display:flex;align-items:center;gap:12px;color:var(--deep);font-size:.9rem}
.intro-item i{font-style:normal;font-size:1.3rem;color:var(--clay)}
.section{padding:86px 0}
.section-head{max-width:650px;margin-bottom:35px}

.services{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.service{background:var(--white);border:1px solid var(--line);padding:28px;border-radius:var(--radius);display:flex;flex-direction:column;min-height:290px}

.contact{background:var(--deep);color:#fff;padding:70px 0}

.contact-info{display:grid;gap:15px}

footer{padding:28px 0;background:#293528;color:#e9e6dc}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer p{margin:0;color:#c3c8bb;font-size:.8rem}
footer a{color:#f2eee2;text-decoration:none;font-size:.88rem}
.float-wa{position:fixed;right:22px;bottom:22px;z-index:30;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#238b58;color:white;text-decoration:none;font-size:25px;box-shadow:var(--shadow)}
/* Internal pages */
.page-hero{padding:64px 0 55px;background:var(--cream)}
.breadcrumb{font-size:.82rem;color:var(--muted);margin-bottom:25px}

.page-grid{display:grid;grid-template-columns:1fr .9fr;gap:55px;align-items:center}
.page-photo{height:390px}.page-photo img{height:100%;border-radius:9px 85px 9px 9px}
.page-content{padding:60px 0}
.content-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:55px}
.soft-panel{background:var(--sage);padding:30px;border-radius:9px}
.soft-panel h3{font-size:1.35rem}
.list{padding-left:20px;color:var(--muted)}.list li{margin:9px 0}
.team-card{display:flex;gap:20px;align-items:center;background:var(--white);padding:20px;border:1px solid var(--line);border-radius:12px;margin-top:25px}
.team-avatar{width:76px;height:76px;border-radius:50%;background:var(--sage);display:grid;place-items:center;font-size:1.8rem;flex:none}
.team-card p{margin:4px 0 0;font-size:.88rem}
.catalog-tools{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:28px 0}
.search{min-width:230px;max-width:340px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:7px;background:var(--white);font:inherit}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{border:1px solid var(--line);background:var(--white);padding:9px 14px;border-radius:30px;font:600 .82rem var(--sans);color:var(--olive);cursor:pointer}
.filter.active{background:var(--olive);color:#fff;border-color:var(--olive)}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.product{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.product-pic{height:175px;background:var(--sage);display:grid;place-items:center;font-size:3rem}
.product-body{padding:18px}
.product-body small{color:var(--clay);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.68rem}
.product-body h3{font-size:1.15rem;margin:6px 0}
.product-body p{font-size:.84rem;margin:0}
.empty{grid-column:1/-1;padding:25px;background:var(--white);border-radius:9px;color:var(--muted)}
.hidden{display:none!important}

.contact-page-hero{background:var(--cream);padding:76px 0 70px}

.hero-image img{object-position:50% 38%}.story-photo img{object-position:50% 26%}

function veterinary(){return `<section class="page-hero"><div class="wrap"><div class="breadcrumb"><a href="#inicio">Início</a> / Atendimento veterinário</div><div class="page-grid"><div><span class="kicker">Saúde e bem-estar</span><h1>Atendimento veterinário</h1><p style="font-size:1.08rem">Cuidado profissional com atenção ao que seu pet precisa.</p><div class="actions"><a class="btn" href="${WA}?text=${encodeURIComponent('Olá! Gostaria de saber mais sobre o atendimento veterinário.') }" target="_blank" rel="noopener noreferrer">Consultar atendimento ↗</a></div></div><div class="page-photo"><img src="${IMG.vet}" alt="Dra. Luara com um cachorro durante um atendimento — imagem tratada digitalmente"></div></div></div></section><section class="page-content"><div class="wrap content-grid"><div><span class="kicker">Conheça quem cuida</span><h2>Carinho e atenção fazem a diferença.</h2><p>A saúde do seu companheiro merece atenção, escuta e cuidado. Entre em contato para consultar os atendimentos disponíveis e saber como funciona o agendamento.</p><div class="team-card"><img class="team-avatar" src="${IMG.portrait}" alt="Retrato da Dra. Luara"><div><h3>Dra. Luara</h3><p>Atendimento veterinário</p><p>Mais informações profissionais serão adicionadas posteriormente.</p></div></div><div class="gallery-pair"><img src="${IMG.pet}" alt="Dra. Luara com um cachorro" loading="lazy"><img src="${IMG.dalmata}" alt="Momento de cuidado com um dálmata" loading="lazy"></div></div><aside class="soft-panel"><h3>Quer saber mais?</h3><p>Fale com a equipe para consultar atendimentos, horários e como agendar.</p><a class="btn" href="${WA}" target="_blank" rel="noopener noreferrer">Falar pelo WhatsApp ↗</a></aside></div></section>${contactSection()}`}

};
function detail(key){let p=pages[key];return `<section class="page-hero"><div class="wrap"><div class="breadcrumb"><a href="#inicio">Início</a> / ${p.title}</div><div class="page-grid"><div><span class="kicker">${p.kicker}</span><h1>${p.title}</h1><p style="font-size:1.08rem;max-width:500px">${p.lead}</p><div class="actions"><a class="btn" href="${WA}?text=${encodeURIComponent('Olá! Gostaria de saber mais sobre '+p.title.toLowerCase()+'.')}" target="_blank">${p.cta} ↗</a><a class="btn outline" href="#inicio">Voltar ao início</a></div></div><div class="page-photo"><img src="${p.img}" alt="${p.alt}"></div></div></div></section>
 <section class="page-content"><div class="wrap content-grid"><div><h2>${key==='veterinario'?'Cuidado que começa pela atenção.':key==='banho-tosa'?'Cada pet tem seu próprio jeitinho.':'Um cantinho para descobrir novidades.'}</h2><p>${p.body}</p>${key==='veterinario'?'<div class="team-card"><div class="team-avatar">🩺</div><div><h3>Dra. Luara</h3><p>Atendimento veterinário</p><p>Em breve: apresentação, especialidades e informações profissionais.</p></div></div>':key==='banho-tosa'?'<div class="team-card"><div class="team-avatar">🐶</div><div><h3>Nossa profissional de banho e tosa</h3><p>Um espaço para conhecer quem cuida do visual e da higiene do seu pet.</p></div></div>':''}</div><aside class="soft-panel"><h3>${p.panel}</h3><p>${p.panelText}</p><a class="btn" href="${WA}" target="_blank">Falar pelo WhatsApp ↗</a></aside></div></section>${contactSection()}`}
const products=[
 {name:'Rações e alimentação',cat:'Alimentação',icon:'🥣',desc:'Alimentos para a rotina do seu pet.'},
 {name:'Petiscos e agrados',cat:'Alimentação',icon:'🦴',desc:'Pequenos agrados para momentos especiais.'},
 {name:'Higiene e cuidados',cat:'Higiene',icon:'🧴',desc:'Itens para os cuidados do dia a dia.'},
 {name:'Acessórios',cat:'Acessórios',icon:'🎀',desc:'Acessórios para conforto e diversão.'},
 {name:'Brinquedos',cat:'Acessórios',icon:'🧸',desc:'Opções para brincar e gastar energia.'},
 {name:'Outros produtos',cat:'Outros',icon:'🐾',desc:'Consulte nossa equipe sobre disponibilidade.'}
];
function catalog(){return `<section class="page-hero"><div class="wrap"><div class="breadcrumb"><a href="#inicio">Início</a> / Nossa loja</div><span class="kicker">Nossa loja</span><h1>Coisinhas boas para<br>quem a gente ama.</h1><p style="max-width:580px">Estamos organizando nosso catálogo. Enquanto isso, explore as categorias e fale com a equipe para consultar os produtos disponíveis.</p></div></section><section class="page-content"><div class="wrap"><div class="catalog-tools"><input class="search" id="productSearch" type="search" placeholder="Buscar no catálogo..." aria-label="Buscar no catálogo"><div class="filters"><button class="filter active" data-filter="Todos">Todos</button><button class="filter" data-filter="Alimentação">Alimentação</button><button class="filter" data-filter="Higiene">Higiene</button><button class="filter" data-filter="Acessórios">Acessórios</button><button class="filter" data-filter="Outros">Outros</button></div></div><div class="product-grid" id="productGrid">${products.map(p=>`<article class="product" data-cat="${p.cat}" data-name="${p.name.toLowerCase()}"><div class="product-pic">${p.icon}</div><div class="product-body"><small>${p.cat}</small><h3>${p.name}</h3><p>${p.desc}</p></div></article>`).join('')}</div><p style="margin-top:25px;font-size:.86rem">Os cartões acima representam categorias iniciais, não produtos ou marcas confirmados. Vamos substituir por fotos e itens reais da loja.</p></div></section>${contactSection()}`}

function contactPage(){return `<section class="contact-page-hero"><div class="wrap"><div class="breadcrumb"><a href="#inicio">Início</a> / Contato</div><div class="contact-hero-grid"><div><span class="kicker">Estamos pertinho de você</span><h1>Vamos conversar?</h1><p>Estamos aqui para ajudar você a cuidar de quem faz parte da família. Tire suas dúvidas, consulte horários ou fale com a nossa equipe.</p></div><div class="contact-team-photo"><img src="luara-com-pet.webp" alt="Dra. Luara com um cachorro" loading="eager"></div></div></div></section>
<section class="contact-page-body"><div class="wrap contact-page-layout"><div><span class="kicker">Fale com a gente</span><h2>Vai ser um prazer receber vocês.</h2><p>Escolha o jeito mais fácil de entrar em contato. Estamos no bairro São Francisco, em Campo Grande.</p><div class="contact-page-details">
<article><b>WhatsApp e telefone</b><p><a href="https://wa.me/5567991028282" target="_blank" rel="noopener noreferrer">(67) 99102-8282 ↗</a></p></article>
<article><b>Endereço</b><p>Rua Padre Valentim, 350 · São Francisco<br>Campo Grande, MS · CEP 79009-290</p></article>
<article><b>Horário de atendimento</b><p>Consulte os horários atualizados com a nossa equipe pelo WhatsApp.</p></article>
<article><b>Instagram</b><p><a href="https://www.instagram.com/petshopdofofinho/" target="_blank" rel="noopener noreferrer">@petshopdofofinho ↗</a></p></article>
</div></div><form class="contact-form" id="contactForm"><span class="kicker">Mande uma mensagem</span><h2>Como podemos ajudar?</h2><p>Preencha os campos e vamos preparar sua mensagem para enviar pelo WhatsApp.</p>
<label for="contactName">Seu nome</label><input id="contactName" name="name" required autocomplete="name" placeholder="Como podemos chamar você?">
<label for="contactPhone">Seu telefone</label><input id="contactPhone" name="phone" type="tel" required autocomplete="tel" placeholder="(67) 99999-9999">
<label for="contactSubject">Sobre o que você quer falar?</label><select id="contactSubject" name="subject" required><option value="" disabled selected>Selecione um assunto</option><option>Atendimento veterinário</option><option>Banho e tosa</option><option>Produtos da loja</option><option>Outras dúvidas</option></select>
<label for="contactMessage">Sua mensagem</label><textarea id="contactMessage" name="message" required placeholder="Conte para a gente como podemos ajudar..."></textarea>
<button type="submit" class="btn">Enviar pelo WhatsApp ↗</button><small>Ao clicar, o WhatsApp abrirá com a mensagem preenchida. Você poderá revisar antes de enviar.</small></form></div></section>
<section class="contact-map"><div class="wrap contact-map-grid"><div><span class="kicker">Venha nos visitar</span><h2>Um cantinho de carinho em Campo Grande.</h2><p>Rua Padre Valentim, 350 · São Francisco, Campo Grande – MS.</p><a class="btn outline" href="https://www.google.com/maps/search/?api=1&query=Rua+Padre+Valentim+350+Sao+Francisco+Campo+Grande+MS" target="_blank" rel="noopener noreferrer">Ver rota no Google Maps ↗</a></div><iframe title="Mapa do Pet Shop Do Fofinho" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=Rua%20Padre%20Valentim%20350%20S%C3%A3o%20Francisco%20Campo%20Grande%20MS&output=embed"></iframe></div></section>`}
function setupContactForm(){const form=document.getElementById('contactForm');if(!form)return;form.addEventListener('submit',event=>{event.preventDefault();if(!form.reportValidity())return;const name=form.elements.name.value.trim();const phone=form.elements.phone.value.trim();const subject=form.elements.subject.value;const message=form.elements.message.value.trim();const text=`Olá! Meu nome é ${name}.\nTelefone: ${phone}\nAssunto: ${subject}\n\n${message}`;window.open(WA+'?text='+encodeURIComponent(text),'_blank','noopener,noreferrer');});}

function render(){let key=location.hash.replace('#','')||'inicio';let app=document.getElementById('app');if(key==='inicio'||key==='servicos')app.innerHTML=home();else if(key==='contato')app.innerHTML=contactPage();else if(key==='loja')app.innerHTML=catalog();else if(key==='veterinario')app.innerHTML=veterinary();else if(pages[key])app.innerHTML=detail(key);else app.innerHTML=home();document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===key));document.querySelector('.navlinks').classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false');document.querySelector('.menu').textContent='☰';window.scrollTo(0,0);setupCatalog();setupContactForm();if(key==='servicos')document.getElementById('servicos')?.scrollIntoView();}
function setupCatalog(){const search=document.getElementById('productSearch');if(!search)return;let filter='Todos';const update=()=>{let q=search.value.toLowerCase();let visible=0;document.querySelectorAll('.product').forEach(card=>{let ok=(filter==='Todos'||card.dataset.cat===filter)&&card.dataset.name.includes(q);card.classList.toggle('hidden',!ok);if(ok)visible++;});let old=document.querySelector('.empty');if(old)old.remove();if(!visible)document.getElementById('productGrid').insertAdjacentHTML('beforeend','<div class="empty">Não encontramos essa categoria ou termo. Fale com a nossa equipe para consultar outros produtos.</div>');};search.addEventListener('input',update);document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));update();}));}
document.querySelector('.menu').addEventListener('click',()=>{let n=document.querySelector('.navlinks');let open=n.classList.toggle('open');document.querySelector('.menu').setAttribute('aria-expanded',String(open));document.querySelector('.menu').textContent=open?'×':'☰';});
window.addEventListener('hashchange',render);document.getElementById('year').textContent=new Date().getFullYear();render();
</script>
